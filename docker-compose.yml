version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: microservices_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount script to create multiple databases on startup
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql

volumes:
  postgres_data: